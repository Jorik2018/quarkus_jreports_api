<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:composition>
        <c:set value="#{systemController.access('ADMIN_TESORERIA')}" var="ADMIN_WARRANTTYPE"/>
        <h:form id="WarrantTypeList">
            <p:panel header="#{NODE_TITLE}">
                <p:dataTable id="datalist" value="#{warrantTypeController.dataModel}" var="item"
                             selection="#{warrantTypeController.selectedList}"
                             paginator="true"
                             rowKey="#{item.id}"
                             rows="50"
                             rowsPerPageTemplate="50,100,150,200"
                             scrollable="true"
                             lazy="true"
                             >
                    <f:facet name="header">
                        <p:commandButton id="createButton" rendered="#{ADMIN_WARRANTTYPE}" icon="ui-icon-plus" styleClass="on" value="#{bundle.Create}" actionListener="#{viewParam.x(warrantTypeController.prepareCreate()).include('/tipoGarantia/Create.xhtml').update('WarrantTypeCreate').set('UPDATE','WarrantTypeList')}" oncomplete="_.o('WarrantTypeCreate',args)"/>
                        <p:commandButton id="editButton" rendered="#{ADMIN_WARRANTTYPE}" icon="ui-icon-pencil" value="#{bundle.Edit}" actionListener="#{viewParam.x(warrantTypeController.getWarrantType(warrantTypeController.selected.id)).include('/tipoGarantia/Create.xhtml').update('WarrantTypeCreate').set('UPDATE','WarrantTypeList').end()}" oncomplete="_.o('WarrantTypeCreate',args)" />
                        <p:commandButton id="deleteButton" rendered="#{ADMIN_WARRANTTYPE}" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{warrantTypeController.destroy}" update=":growl,datalist" />
                    </f:facet>
                    <p:column selectionMode="multiple"  styleClass="checked-column"/>
                    <p:column width="200" filterBy="#{sessionController.pp['name']}">
                        <f:facet name="filter" >
                            <p:inputText value="#{sessionController.pp['name']}" />
                        </f:facet>
                        <f:facet name="header">
                            <h:outputText value="#{bundle.Name}"/>
                        </f:facet>
                        <h:outputText value="#{item.name}"/>
                    </p:column>
                    <p:column/>
                </p:dataTable>
            </p:panel>
        </h:form>
    </ui:composition>
</html>

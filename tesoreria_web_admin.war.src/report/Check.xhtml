<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "htt//www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="htt//www.w3.org/1999/xhtml"
      xmlns:ui="htt//xmlns.jcp.org/jsf/html"
      xmlns:v-on="htt//xmlns.jcp.org/jsf/passthrough"
      xmlns:v-slot="htt//xmlns.jcp.org/jsf/passthrough"
      xmlns:v-bind="htt//xmlns.jcp.org/jsf/passthrough"
      xmlns:c="htt//xmlns.jcp.org/jsp/jstl/core">
    <c:set value="#{systemController.access('ADMIN_TESORERIA_WARRANT')}" var="ADMIN_TESORERIA"/>
    <v-form id="CheckList" header="#{NODE_TITLE}" action="/admin/tesoreria/warrant">
        <v-table ref="table" 
                 v-bind:value="data"
                 row-key="id"
                 v-bind:key="k"
                 scrollable="true"
               
                 >
            <template v-slot:header="">
                Año: 
                <input style="width: 50px" min="0" v-model="ano_eje" type="number"/>
                Expediente: 
                <input style="width: 50px" min="0" v-model="expediente" type="number"/>
                
                <v-button icon="fa-sync" v-on:click.prevent="refresh" 
                          v-bind:disabled="!expediente"/>
                <v-uploader value="#{bundle.Import}" v-on:input="upload" />
                <div style="display:  inline-block; margin: 0px 5px">
                    X:
                    <input style="width: 50px" min="0" v-model="x" type="number"/>
                    Y:
                    <input style="width: 50px" min="0" v-model="y" size="5" type="number"/></div>
                <v-button title="#{bundle.Print}" icon="fa-print" v-on:click.prevent="print" 
                          v-bind:disabled2="!rowSelectedCount"/>
            </template>
            <template v-slot:default="{row,index}">
                <td class="center" header="#" width="28" >
                    {{pad(index+1,3)}}
                </td>
                <td width="80" class="center" header="#{bundle.Expediente}">
                    {{pad(row.expediente,8)}}
                </td>
                <td width="80" class="center" header="#{bundle.Secuencia}">
                    {{pad(row.secuencia,4)}}
                </td>
                <td width="80" class="center" header="#{bundle.Correlativo}">
                    {{row.correlativo}}
                </td>
                <td width="80" class="center" header="#{bundle.Banco}">
                    {{row.banco}}
                </td>
                <td width="80" class="center" header="#{bundle.CtaCte}">
                    {{row.ctaCte}}
                </td>
                <td width="80" class="center" header="#{bundle.CodDoc}">
                    {{row.codDoc}}
                </td>
                <td width="80" class="center" header="#{bundle.NumDoc}">
                    {{row.numDoc}}
                </td>
                <td width="300" label="#{bundle.FullName}">
                    {{row.nombre}}
                </td>
                <td width="80" class="center" header="#{bundle.Comprobante}">
                    {{row.comprobante}}
                </td>
                <td width="80" class="center" header="#{bundle.Fecha}">
                    {{row.fecha|date('dMY')}}
                </td>
                <td width="80" class="right" header="#{bundle.Amount}">
                    {{1.0*row.monto}}
                </td>
                <td width="80" class="right" header="#{bundle.NationalAmount}">
                    {{1.0*row.montoNacional}}
                </td>
            </template>
        </v-table>
    </v-form>
    <script src="https://unpkg.com/jspdf@2.3.0/dist/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/1.3.4/jspdf.min.js"></script>
    <script src="/cdn/NumeroALetras.js"></script>
    <script>
_.ui({
    el: '#CheckList',
    data: function () {
        return {data: [], k: 0, x: 0, y: 0,c:null,ano_eje:new Date().getFullYear(),expediente:null}
    },
    created(){
        var v=localStorage.getItem('check.location');
        var o=JSON.parse(v);
        if(o){
            if(o.x)this.x=o.x;
            if(o.y)this.y=o.y;
        }
    },
    computed: {
        rowSelectedCount() {
            var me = this;
            if (!me.$refs.table)
                return 0;
            var t = me.$refs.table;
            return t ? t.selected.length : 0;
        }
    },
    methods: {
        upload(o) {
            var me = this;
            /*fetch('https://api.github.com/repos/javascript-tutorial/en.javascript.info/commits')
                .then(response => response.json())
                .then(commits => alert(commits[0].author.login));*/
            axios.post('/admin/tesoreria/api/check/import/' + o.tempFile).then((e) => {
                me.data = e.data;
                me.$refs.table.kc++;
            });
            
        },
        refresh(){
            var me=this;
            axios.get('https://web.regionancash.gob.pe/admin/siaf/api/4/'+me.ano_eje+'/'+me.expediente).then((e) => {
                me.data = e.data;
                me.$refs.table.kc++;
            });
        },
        print() {
            var me = this, t = me.$refs.table, s = t.selected;
            var doc = new jsPDF('0','mm',[80, 240]);
            doc.setFontSize(10);
            doc.setFont('Arial');
            doc.setFontType("bold");
            var fields = [
                {name: 'nombre', x: 60, y: 22, w: 1000,fs:9},
                {name: 'expediente', x: 32, y: 22, w: 1000},
                {name: 'comprobante', x: 21, y: 22, w: 1000},
                {name: 'monto', x: 44, y: 22, w: 1000},
                
                
                {name: 'nombreCompleto', x: 54, y: 75, w: 1000},
                {name: 'amountName', x: 46, y: 65, w: 1000},
                
                {name: 'region', x: 66, y: 131, w: 1000, value: 'ANCASH'},
                {name: 'day', x: 66, y: 151, w: 1000},
                {name: 'month', x: 66, y: 163, w: 1000},
                {name: 'year', x: 66, y: 174, w: 1000},
                
                
                {name: 'day2', x: 66, y: 20, w: 1000},
                {name: 'monto2', x: 66, y: 206, w: 1000},
                {name: 'month2', x: 66, y: 33, w: 1000},
                {name: 'year2', x: 66, y: 44, w: 1000}
            ];
            function numberWithCommas(x) {
                return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            }
            var x = me.x, y = me.y;
            localStorage.setItem('check.location',JSON.stringify({x:x,y:y}));
            for (var i = 0; s.length > i; i++) {
                var e = JSON.clone(t.data[s[i]]);
                var ni=Math.trunc(e.monto);
                var date = new Date(e.fecha);
                var dec=(Math.round(((e.monto-ni) + Number.EPSILON) * 100));
                e.amountName = numeroALetras(ni, {
                    plural: ' ',
                    singular: ' ',
                    centPlural: ' ',
                    centSingular: ' '
                }).trim()+ ' Y '+me.pad(dec,2)+'/100 SOLES';
                e.nombreCompleto = e.nombre;
                e.monto=numberWithCommas(ni)+'.'+me.pad(dec,2);
                e.monto2 = e.monto;
                var n=e.nombre.split(' '),tmp=n[0],s2='';
                n.push('                    ');
                console.log(n);
                for(var k=1;n.length>k;k++){
                    if((tmp+n[k]+' ').length>17){
                        s2+=tmp+'\n';
                        tmp=n[k];
                    }else
                        tmp+=' '+n[k];
                }
                console.log(s2);
                e.nombre=s2;
                e.today = _.toDate(date, 'dMY');
                e.expediente = 'SIAF: ' + me.pad(Number(e.expediente),8);
                e.comprobante = 'CP: ' + e.comprobante;
                e.monto = 'S/ ' + e.monto;
                e.year = date.getFullYear();
                e.day = me.pad(date.getDate(),2);
                e.month = me.pad(date.getMonth() + 1,2);
                e.month2 = e.month;
                e.year2 = e.year;
                e.day2 = e.day;
               
                for (var c = 0; fields.length > c; c++) {
                    var f = fields[c];
                    doc.setFontSize(f.fs?f.fs:10);
                    doc.text(Number(x) + f.x, Number(y) + f.y, '' + (f.value ? f.value : e[f.name]),270);
                }
                if (s.length > (i + 1))doc.addPage();
            }
            //doc.autoPrint();
            //window.open(doc.output('datauristring'));
            doc.save();
        }
    }
});
    </script>
</html>

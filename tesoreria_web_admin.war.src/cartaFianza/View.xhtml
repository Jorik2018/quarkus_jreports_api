<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:v-on="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:v-bind="http://xmlns.jcp.org/jsf/passthrough"
                xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <v-form id="WarrantCreate" header="#{(empty o.id?bundle.Create:bundle.Edit)} #{'Carta Fianza'}">
        <div class="v-form">
            <label>#{bundle.Proveedor}:</label>
            <div>{{bundle.proveedor}}</div>
            <label>#{bundle.Expediente}:</label>
            <div>{{bundle.expediente}}</div>
            <label>#{bundle.Entidad}:</label>
            <div>{{o.entidad}}</div>
            <label>#{bundle.Obra}:</label>
            <v-textarea required="true" id="obra" v-model="o.obra" title="#{bundle.obra}" />
            <label>#{bundle.Tipo}:</label>
            <v-select id="tipoGarantia" 
                      v-model="o.warrantTypeId"
                      required="true">
                <option value="">#{bundle.SelectOneMessage}</option>
                <v-options url="/admin/tesoreria/api/warrant-type/0/0" value-field="id" display-field="name"/>
            </v-select>
            <label>#{bundle.Total}:</label>
            <input id="total" v-model="o.total" required="true" decimalSeparator="." thousandSeparator="," title="#{bundle.total}" />
            <label>#{bundle.Fecha} #{bundle.Renovacion}:</label>
            <div>{{o.fechaRenovacion|date}}</div>
            <label>#{bundle.Nro} #{bundle.Carta}:</label>
            <div>{{o.nroCarta}}</div>
            <label>#{bundle.Fecha} #{bundle.Emision}:</label>
            <div>{{o.fechaEmision|date}}</div>
            <label>#{bundle.Fecha} #{bundle.Vencimiento}:</label>
            <div>{{o.fechaVencimiento|date}}</div>
            <label>#{bundle.Fecha} #{bundle.Registro}:</label>
            <div>{{o.fechaRegistro|date}}</div>
            <label>#{bundle.Observacion}:</label>
            <div>{{o.observacion}}</div>
            <label>#{bundle.Confirmacion} #{bundle.Banco}:</label>
            <div>{{o.confirmacionBanco}}</div>
            <label>#{bundle.Renovated}:</label>
            <v-switch id="renovado" v-model="o.renovated"/>
            <div class="center uploader" style="margin-bottom: 20px">
                <div style="padding: 10px 0px">
                    <a v-if="tempFile" v-bind:href="'/fs/temp/'+tempFile" target="_cartaFianza" >Ver Documento</a>
                </div>
                <template v-if="o.upload">
                    <div style="padding: 10px 0px">
                        <a v-if="!tempFile" href="'/fs/tesoreria/cartaFianza/'+o" target="_cartaFianza" >Ver Documento</a>
                    </div>
                    <div style="margin-bottom: 8px">
                        <v-checkbox v-model="deleteUpload" label="Eliminar archivo adjunto" v-on:input="deleteInput"/>
                    </div>
                </template>
                <template v-if="o.cartaFianzaUpload">
                    <div style="word-wrap: break-word ; padding: 10px 0px">
                        {{o.cartaFianzaUpload.filename}}
                    </div>
                </template>
                <v-uploader v-on:input="uploaderInput"/>
            </div>

        </div>
        <center>
            <v-button value="#{bundle.Cancel}" icon="fa-ban" v-on:click.prevent="close"/>
        </center>
    </v-form>
    <script>
        _.ui({
            porps: ['id'],
            data: function () {
                return {deleteUpload: null, tempFile: null, o: {}}
            },
            created() {
                var me = this, id = me.id;
                if (id) {
                    axios.get('/admin/tesoreria/api/warrant/' + id).then(function (response) {
                        var o = response.data;
                        console.log(o);
                        if (!o.ext)
                            o.ext = {};
                        o.ext.src = null;
                        o.ext.tempFile = null;
                        me.o = o;
                    });
                }
            },
            methods: {
                nuevoExpediente(o) {},
                deleteInput(o) {
                    //document.querySelector('.delete-upload').v-model = o ? o : null;
                },
                uploaderInput(o) {
                    //document.querySelector('.tempFile').v-model = o.tempFile;
                    //this.tempFile = o.tempFile;
                }
            }
        })
    </script>
</ui:composition>

<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <ui:composition>
        <h:form id="RequestView">
            <c:set value="#{requestController.selected}" var="o"/>
            <p:panel id="display" rendered="#{not empty o.id}" class="x-view" header="#{bundle.Request} #{'N° '} #{o.id}">
                <div class="ui-toolbar x-toolbar">
                    <p:commandButton icon="ui-icon-gear" actionListener="#{viewParam.set('UPDATE',':RequestView:display').set('selected',o)}" rendered="#{empty o.approval and empty o.confirmed}" value="#{bundle.Approve}" update="Approve" oncomplete="_.o('Approve',args)" />
                    <p:commandButton ajax="false" icon="ui-icon-arrowthick-1-s" value="Recibo Provisional"  onclick="PrimeFaces.monitorDownload(_.mask, _.unmask)">
                        <p:fileDownload  value="#{requestController.getContent(viewParam.set('request:id',o.id).p)}"/>
                    </p:commandButton>
                    <p:commandButton icon="ui-icon-gear" rendered="#{not empty o.approval and empty o.confirmed}" actionListener="#{viewParam.set('UPDATE',':RequestView')}" value="Confirmar Rendición" update="@this:@parent,:growl" oncomplete="_.o('RendicionConfirm')"/>
                </div>
                <p:panelGrid columns="2" layout="grid" styleClass="ui-form-layout" rendered="#{o != null}">
                    <h:outputLabel value="#{bundle.Dependency}:"/>
                    <h:outputText value="#{o.dependency}" />
                    <h:outputLabel value="#{bundle.Position}:"/>
                    <h:outputText value="#{o.position.name}" />
                    <h:outputLabel value="#{bundle.Employee}:"/>
                    <h:outputText value="#{o.people}" />
                    <h:outputLabel value="#{bundle.Amount}:"/>
                    <h:outputText value="S/. #{o.amount}" title="#{bundle.Amount}"/>
                    <h:outputLabel value="#{bundle.Description}:"/>
                    <h:outputText value="#{o.description}" title="#{bundle.Description}"/>
                    <h:outputLabel rendered="#{not empty o.approval}" value="#{bundle.Approval}"/>
                    <h:outputText rendered="#{not empty o.approval}" value="#{o.approval}" title="#{bundle.Approval}"/>
                    <h:outputLabel rendered="#{not empty o.signed}" value="#{bundle.Signed}"/>
                    <h:outputText rendered="#{not empty o.signed}" value="#{o.signed}" title="#{bundle.Signed}"/>
                    <h:outputLabel rendered="#{not empty o.confirmed}" value="Rendición:"/>
                    <h:outputText rendered="#{not empty o.confirmed}" value="#{o.confirmed}" title="#{bundle.Confirmed}"/>
                    <h:outputLabel rendered="#{not empty o.cancellation}" value="#{bundle.Cancellation}"/>
                    <h:outputText rendered="#{not empty o.cancellation}" value="#{o.cancellation}" title="#{bundle.Cancellation}"/>
                </p:panelGrid>
                <c:set value="#{systemController.access('ADMIN_TESORERIA_VOUCHER')}" var="ADMIN_TESORERIA_VOUCHER"/>
                <p:dataTable id="datalist" value="#{voucherController.getItems(viewParam.set('voucher:request',o).p)}" var="item"
                             selection="#{voucherController.selectedList}"
                             reflow="true"
                             rowIndexVar="riv"
                             rowKey="#{item.id}"
                             >

                    <f:facet name="header">
                        <p:commandButton id="createButton" rendered="#{ADMIN_TESORERIA_VOUCHER}" icon="ui-icon-plus" styleClass="on" value="#{bundle.Create}" actionListener="#{viewParam.set('request',o).x(voucherController.prepareCreate(viewParam.set('minimal',true).p)).include('/tesoreria/voucher/Create.xhtml').update('VoucherCreate').set('UPDATE','RequestView:datalist')}" oncomplete="_.o('VoucherCreate',args)"/>
                        <p:commandButton id="editButton" rendered="#{ADMIN_TESORERIA_VOUCHER}" icon="ui-icon-pencil" value="#{bundle.Edit}" actionListener="#{viewParam.include('/tesoreria/voucher/Create.xhtml').update('VoucherCreate').set('UPDATE','VoucherList')}" oncomplete="_.o('VoucherCreate',args)" />
                        <p:commandButton id="deleteButton" rendered="#{ADMIN_TESORERIA_VOUCHER}" icon="ui-icon-trash"  value="#{bundle.Delete}" actionListener="#{voucherController.destroy}" update=":growl,datalist" />
                    </f:facet>
                    <p:column selectionMode="multiple"  styleClass="checked-column"/>

                    <p:column class="center" width="28" >
                        <f:facet name="header">
                            <h:outputText value="#"/>
                        </f:facet>
                        <h:outputText value="#{riv+1}" title="#{item.id}">
                            <f:convertNumber pattern="000" />
                        </h:outputText>
                    </p:column>
                    <p:column width="100">
                        <f:facet name="header">
                            <h:outputText value="#{bundle.Type}"/>
                        </f:facet>
                        <h:outputText value="#{item.voucherType.name}"/>
                    </p:column>
                    <p:column width="100" styleClass="center">
                        <f:facet name="header">
                            <h:outputText value="#{bundle.Clasificador}"/>
                        </f:facet>
                        <h:outputText value="#{item.clasificador}"/>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="#{bundle.Documento}"/>
                        </f:facet>
                        <h:outputText value="#{item.documento}"/>
                    </p:column>
                    <p:column width="80" class="center">
                        <f:facet name="filter" >
                            <p:inputText type="hidden" id="fecha"  class="x-date-filter"  value="#{sessionController.pp['fecha']}" />
                        </f:facet>
                        <f:facet name="header">
                            <h:outputText value="#{bundle.Fecha}"/>
                        </f:facet>
                        <h:outputText value="#{item.fecha}">
                            <f:convertDateTime pattern="dd/MM/yyyy"  />
                        </h:outputText>
                    </p:column>
                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="#{bundle.Detail}"/>
                        </f:facet>
                        <h:outputText value="#{item.detail}"/>
                    </p:column>
                    <p:column width="80" styleClass="right">
                        <f:facet name="header">
                            <h:outputText value="#{bundle.Amount}"/>
                        </f:facet>
                        <h:outputText value="#{0.0+item.amount}" >
                            <f:convertNumber locale="es_US" minFractionDigits="2"  />
                        </h:outputText>

                    </p:column>
                </p:dataTable>
            </p:panel>

        </h:form>
        <p:dialog id="RendicionConfirm" header="Confirmar Operación" widgetVar="RendicionConfirm">
            <h:form>
                <h:panelGroup>
                    <div style="padding:10px 0px">
                        Esta seguro que desea dar por rendida la presente solicitud de Caja Chica
                    </div>
                    <center>
                        <p:commandButton icon="ui-icon-check" actionListener="#{requestController.process(viewParam.set('selectedXXXX',o).set('AAAAAAAAAA','AAAAAAAAAAAA').set('ACTION','reportBack').set('selected',o).p)}" value="#{bundle.Yes}" update=":growl,:RequestList:datalist,:RequestView:display,@form" oncomplete="return _.c(this,args)" />

                        <p:button icon="ui-icon-cancel" value="#{bundle.Cancel}" onclick="return _.c(this)"/>
                    </center>
                </h:panelGroup>
            </h:form>
        </p:dialog>
    </ui:composition>
</html>

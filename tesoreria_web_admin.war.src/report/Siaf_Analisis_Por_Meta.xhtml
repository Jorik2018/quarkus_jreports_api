<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "htt//www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="htt//www.w3.org/1999/xhtml"
      xmlns:ui="htt//xmlns.jcp.org/jsf/html"
      xmlns:v-on="htt//xmlns.jcp.org/jsf/passthrough"
      xmlns:v-slot="htt//xmlns.jcp.org/jsf/passthrough"
      xmlns:v-bind="htt//xmlns.jcp.org/jsf/passthrough"
      xmlns:c="htt//xmlns.jcp.org/jsp/jstl/core">

    <v-form header="#{NODE_TITLE}" action="/admin/tupa/api/pago">
        <v-table ref="table" vbindsrc="'/admin/siaf/api/6/'+o.year+'/'+o.month" v-bind:value="o.data" scrollable="true"
                 autoload="false" storage="siaf-analisis-metas"
                 v-on:loaded="storage"
                 summary="1"
                 >
            <template v-slot:header="">
                <label>Año: </label>
                <input v-model="o.year" type="number" class="center" style="width: 60px"/>
                <label>Mes: </label>
                <v-select v-model="o.month" style="width: 120px;display: inline-block">
                    <option v-for="(m,i) in month" v-bind:value="i+1">{{m}}</option>
                </v-select>
                <v-button icon="fa-sync" v-on:click="refresh"/>
                <v-button icon="fa-download" v-on:click="download"/>
            </template>
            <template v-slot:default="{row,index}">
                <td header="SecFunc" width="60" sort="secFunc" class="center">
                    {{row.secFunc}}
                </td>    
                <td header="Meta" sort="metaNombre" width="220">
                    {{row.metaNombre}}
                </td>
                <td header="Finalidad" sort="finalidadNombre" width="60" class="center">
                    {{row.finalidad}}
                </td>
                <td header="Finalidad Nombre" sort="finalidadNombre" width="220">
                    {{row.finalidadNombre}}
                </td>
                <td header="Expedientes" sort="count" width="100" class="right">
                    {{row.count}}
                </td>
                <td header="Comprometido" width="100" sort="C" class="right">
                    {{row.C|number}}
                </td>
                <td header="Devengado" width="100" sort="D" class="right">
                    {{row.D|number}}
                </td>
                <td header="Girado" width="100" sort="G" class="right">
                    {{row.G|number}}
                </td>
                <td header="Pagado" width="100" sort="P" class="right">
                    {{row.P|number}}
                </td>
                
            </template>
            <template v-slot:summary="{data}">
                <td width="100" class="center">
                    TOTAL
                </td>    
                <td width="220"></td>
                <td width="100"></td>
                <td width="220" class="center">Finalidades {{data.length}}</td>
                <td width="100" class="right">
                   
                </td>
                <td width="100" class="right">
                    {{data.sum('C')|number}}
                </td>
                <td width="100" class="right">
                    {{data.sum('D')|number}}
                </td>
                <td width="100" class="right">
                    {{data.sum('G')|number}}
                </td>
                <td width="100" class="right">
                    {{data.sum('P')|number}}
                </td>
            </template>
        </v-table>
        <div class="v-form">
            <label>Año:</label>
            <input type="number" v-model="o.year"/>
            <label>Mes:</label>
            <v-select v-model="o.month">
                <option>Seleccionar opcion</option>
                <option v-for="(m,i) in month" v-bind:value="i+1">{{m}}</option>
            </v-select>
        </div>
        <center>
            <v-button icon="fa-download" v-on:click.prevent="download" value="#{bundle.Download}"/>
            <v-button icon="fa-ban" v-on:click.prevent="close" value="#{bundle.Cancel}"/>
        </center>
        
    </v-form>
    <script>
        axios.defaults.baseURL='http://localhost:7040';
        //    http://localhost:7040/api/6/2021/20530592520
        _.ui({
            data: {
                o: {
                    data:[],
                    year: new Date().getFullYear(), 
                    month:null
                }, 
                month: ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE']
            },
            created(){
                var me=this,o=JSON.parse(localStorage.getItem('siaf-finalidad'));
                console.log(o);
                if(o.data&amp;&amp;o.year){
                    var func=function(v){
                        if(v)v=Number(v);
                        if(isNaN(v))v=null;
                        return v;
                    }
                    for(var i=0;o.data.length>i;i++){
                        o.data[i].C=func(o.data[i].C);
                        o.data[i].G=func(o.data[i].G);
                        o.data[i].D=func(o.data[i].D);
                        o.data[i].P=func(o.data[i].P);
                    }
                    me.o=o;
                }else{
                    localStorage.setItem('siaf-finalidad',null);
                }
            },
            methods: {
                refresh(){
                    var me = this;
                    var o = JSON.parse(JSON.stringify(me.o));
                    //http://localhost:7040
                    //https://web.regionancash.gob.pe/admin/siaf
                    axios.post('/api/6/' + o.year + '/' + 0,{select:'proveedor',order:'proveedor'}).then((r) => {
                        o.data=r.data;
                        localStorage.setItem('siaf-finalidad',JSON.stringify(o));
                        me.o=o;
                        me.$refs.table.kc++;
                        /*o.tempFile = r.data.tempFile;
                        axios.post('/admin/jasper/api/download', o, {
                            responseType: 'blob'
                        }).then((response) => {
                            const url = window.URL.createObjectURL(new Blob([response.data]));
                            const link = document.createElement('a');
                            link.href = url;
                            link.setAttribute('download', 'ingreso-mes.pdf');
                            document.body.appendChild(link);
                            link.click();
                        });*/
                    });
                },
                storage(e){
                    var t=e.target;
                    localStorage.setItem(t.storage,JSON.stringify(t.data));
                },
                download() {
                    var me = this;
                    var o = JSON.parse(JSON.stringify(me.o));
                    //http://localhost:7040
                    //https://web.regionancash.gob.pe/admin/siaf
                    axios.post('https://web.regionancash.gob.pe/admin/siaf/api/5/' + o.year + '/' + o.month).then((r) => {
                        o.tempFile = r.data.tempFile;
                        me.saveAs('/admin/jasper/api/download', o,'ingreso-mes.pdf');
                    });
                }
            }
        });
    </script>
</html>

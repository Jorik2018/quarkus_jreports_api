<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:v-on="http://xmlns.jcp.org/jsf/passthrough"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <v-form header="#{NODE_TITLE}">
        <v-fieldset legend="Parametros" class="v-form">
            <div class="center label">VENCIMIENTO</div>
            <hr size="2"/>
            <div style="display:inline-block;width: calc(50% - 4px);margin-right: 2px;">
                <label>Desde:</label>
                <v-calendar style="width:100%" v-model="o.FECHA_INI"/>  
            </div>
            <div style="display:inline-block;width: calc(50% - 4px);margin-left: 2px;">
                <label>Hasta:</label>
                <v-calendar style="width:100%" v-model="o.FECHA_FIN"/>  
            </div>
            <hr size="2"/>
            <div columns="2"  styleClass="gra" layout="grid" style="margin-bottom:10px;width: 100%" >
                <label>Titulo de Reporte:</label>
                <v-textarea v-model="o.TITLE_REPORT"/>  
                <label>Mostrar solo las cartas fianza por vencer:</label>
                <v-switch v-model="o.danger"/>
                <label>Ordenado por:</label>
                <v-radio-group v-model="o.order">
                    <v-radio value="e" label="Expediente"/>
                    <v-radio value="v" label="Fecha Vencimiento"/>
                </v-radio-group>
                <label>Agrupado por:</label>
                <v-radio-group v-model="o.group">
                    <v-radio value="0" label="Ninguno"/>
                    <v-radio value="1" label="Expediente"/>
                    <v-radio value="2" label="Proveedor"/>
                </v-radio-group>
                <label>Formato de Salida:</label>
                <v-radio-group v-model="o.FORMAT">
                    <v-radio value="pdf" label="Documento de Formato Portable (pdf)"/>
                    <v-radio value="xls" label="Hoja de Calculo Excel (xls)"/>
                </v-radio-group>
            </div>
        </v-fieldset>
        <center>
            <v-button icon="fa-download" v-on:click.prevent="download" value="#{bundle.Download}"/>
            <v-button value="#{bundle.Cancel}" icon="fa-ban" v-on:click.prevent="close"/>
        </center>


    </v-form>
    <script>
        _.ui({
            data: function () {
                return {o: {FORMAT: 'pdf', danger: false, title: 'REPORTE DE CARTAS FIANZAS'}}
            },
            mounted() {
                var o =#{utilController.toJson(sessionController.clonePageMap())};
                console.log(o);
                if (o.FECHA_INI)
                    o.FECHA_INI = Date.parse(o.FECHA_INI);
                if (o.FECHA_FIN)
                    o.FECHA_FIN = Date.parse(o.FECHA_FIN);
                o.danger = false;
                this.o = Vue.mergeDeep(this.o, o);
                ;
            },
            methods: {
                c(o) {
                    _.c(o.target);
                },
                expo() {
                    //{warrantController.getContent(sessionController.clonePageMap())}
                },
                download() {
                    var me = this;
                    var o = JSON.parse(JSON.stringify(me.o));
                    if (typeof o.FECHA_INI === 'number')
                        o.FECHA_INI = _.toDate(o.FECHA_INI, 'dMY');
                    if (typeof o.FECHA_FIN === 'number')
                        o.FECHA_FIN = _.toDate(o.FECHA_FIN, 'dMY');

                    axios.post('/admin/tesoreria/api/warrant/download', o, {
                        responseType: 'blob' // important
                    }).then((response) => {
                        const url = window.URL.createObjectURL(new Blob([response.data]));
                        const link = document.createElement('a');
                        link.href = url;
                        link.setAttribute('download', 'warrant.' + o.FORMAT);
                        document.body.appendChild(link);
                        link.click();
                    });
                }
            }
        });
    </script>
</html>

<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "htt//www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="htt//www.w3.org/1999/xhtml"
      xmlns:ui="htt//xmlns.jcp.org/jsf/html"
      xmlns:v-on="htt//xmlns.jcp.org/jsf/passthrough"
      xmlns:v-slot="htt//xmlns.jcp.org/jsf/passthrough"
      xmlns:v-bind="htt//xmlns.jcp.org/jsf/passthrough"
      xmlns:c="htt//xmlns.jcp.org/jsp/jstl/core">
    <v-form header="#{NODE_TITLE}" action="/admin/tupa/api/pago">
        <v-table ref="table" v-model="o.data" vbindsrc="'http://localhost:7040/api/5/'+o.year+'/'+o.month" scrollable="true"
                 autoload="false" storage="siaf-analisis-meta"
                 v-on:loaded="storage"
                 >
            <template v-slot:header="">
                <label>Año: </label>
                <input v-model="o.year" type="number" class="center" style="width: 60px"/>
                <label>Mes: </label>
                <v-select v-model="o.month" style="width: 120px;display: inline-block">
                    <option v-for="(m,i) in month" v-bind:value="i+1">{{m}}</option>
                </v-select>
                <v-button icon="fa-sync" v-on:click="refresh"/>
                <v-button icon="fa-download" v-on:click="download"/>
            </template>
            <template v-slot:default="{row,index}">
                <td header="Sec. Func." width="40" class="center">
                    {{row.secFunc}}
                </td>                
                <td header="Clasificador" width="80" class="center">
                    {{row.clasificador.replaceAll(' ','.')}}
                </td>
                <td header="Expediente" width="80" class="center">
                    {{row.expediente}}
                </td>
                <td header="Proveedor" width="220">
                    {{row.ruc}}: {{row.personaNombre}}
                </td>
                <td header="Cadena Programatica" width="230" class="center">
                    {{row.actProy}}.{{row.componente}}.{{row.funcion}}.{{row.programa}}.{{row.subPrograma}}.{{row.meta}}
                </td>
                <td header="Finalidad" width="300">
                    {{row.finalidad}}: {{row.finalidadNombre}}
                </td>
                <td header="Comprometido" width="100" class="right">
                    {{row.C}}
                </td>
                <td header="Devengado" width="100" class="right">
                    {{row.D}}
                </td>
                <td header="Girado" width="100" class="right">
                    {{row.G}}
                </td>
                <td header="Pagado" width="100" class="right">
                    {{row.P}}
                </td>
                
            </template>
        </v-table>
        <div class="v-form">
            <label>Año:</label>
            <input type="number" v-model="o.year"/>
            <label>Mes:</label>
            <v-select v-model="o.month">
                <option value="0">Seleccionar opcion</option>
                <option v-for="(m,i) in month" v-bind:value="i+1">{{m}}</option>
            </v-select>
        </div>
        <center>
            <v-button icon="fa-download" v-on:click.prevent="download" value="#{bundle.Download}"/>
            <v-button icon="fa-ban" v-on:click.prevent="close" value="#{bundle.Cancel}"/>
        </center>
        
    </v-form>
    <script>
        _.ui({
            data: {
                o: {
                    data:[],
                    recoveryDate:null,
                    year: new Date().getFullYear(), 
                    month: new Date().getMonth()+1
                }, 
                month: ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE']
            },
            mounted(){
                this.$refs.table.loadStorage();
            },
            methods: {
                refresh(){
                    var me = this;
                    var o = JSON.clone(me.o);
                    axios.post(
                        'http://localhost:7040'+
                        '/api/5/' + o.year + '/' + o.month,{a:1,select:'ruc,proveedor',ruc:1344141}).then((r) => {
                        o.data=r.data;
                        o.recoveryDate=new Date().getTime();
                        localStorage.setItem('siaf-analisis-meta',JSON.stringify(o));
                        me.o=o;
                        me.$refs.table.kc++;
                    });
                },
                storage(e){
                    var t=e.target;
                    localStorage.setItem(t.storage,JSON.stringify(t.data));
                },
                download(e) {
                    var me = this;
                    var o = JSON.clone(me.o);
                    if(Array.isArray(o.data)){
                        me.saveAs('/admin/jasper/api/download',o,'report.pdf');
                    }else
                        axios.post('/api/6/' + o.year + '/' + o.month).then((r) => {
                            o.data=r.data;
                            me.saveAs('/admin/jasper/api/download',o,'report.pdf');
                        });
                }
            }
        });
    </script>
</html>
